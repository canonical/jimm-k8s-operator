# Learn more about charmcraft.yaml configuration at:
# https://juju.is/docs/sdk/charmcraft-config
type: "charm"
parts:
  charm:
    charm-strict-dependencies: true
    charm-binary-python-packages:
      - annotated-types
      - attrs
      - certifi
      - cffi
      - charmhelpers
      - charset-normalizer
      - click
      - cosl
      - cryptography
      - ecdsa
      - exceptiongroup
      - hvac
      - idna
      - importlib_metadata
      - iniconfig
      - Jinja2
      - jsonschema
      - jsonschema-specifications
      - MarkupSafe
      - netaddr
      - ops
      - opentelemetry-api
      - ops-scenario
      - packaging
      - pbr
      - pluggy
      - pycparser
      - pyasn1
      - pydantic
      - pydantic_core
      - pytest
      - pytest-interface-tester
      - Pygments
      - python-jose
      - PyYAML
      - referencing
      - requests
      - rsa
      - rpds-py
      - setuptools
      - six
      - tenacity
      - tomli
      - typer
      - typing-inspection
      - typing_extensions
      - urllib3
      - websocket-client
      - zipp
bases:
  # This run-on is not as strict as the machine charm
  # as the jimm-server runs in a container.
  # So the only restriction for build-on vs run-on is
  # the charm code.
  - build-on:
      - name: "ubuntu"
        channel: "22.04"
        architectures:
        - amd64
    run-on:
      - name: "ubuntu"
        channel: "22.04"
        architectures:
        - amd64
