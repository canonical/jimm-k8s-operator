name: Release to v3/edge

on:
  workflow_dispatch:
  push:
    branches:
      - v3

# Note this workflow requires a Github secret to provide auth against charmhub.
# This can be generated with the following command (ttl=6 months)
# charmcraft login --export=secrets.auth --charm=juju-jimm-k8s --permission=package-manage --permission=package-view --ttl=15552000

jobs:
  charm-tests:
    uses: ./.github/workflows/test.yaml

  release-charm:
    name: Release charm
    needs:
      - charm-tests
    permissions:
      contents: write # Needed to tag the release
      packages: read # Needed to log into ghcr.io
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          fetch-tags: true 
      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload charm to charmhub
        uses: canonical/charming-actions/upload-charm@1753e0803f70445132e92acd45c905aba6473225 # 2.7.0
        with:
          credentials: "${{ secrets.CHARMHUB_TOKEN }}"
          github-token: "${{ secrets.GITHUB_TOKEN }}"
          channel: "3/edge"
